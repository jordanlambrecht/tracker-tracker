---
name: tracker-tracker

# ╔══════════════════════════════════════════════════════════╗
# ║                                                          ║
# ║                    Tracker Tracker                       ║
# ║                                                          ║
# ╚══════════════════════════════════════════════════════════╝
#
# Documentation: https://github.com/jordanlambrecht/tracker-tracker

services:
  tracker-tracker-app:
    image: ghcr.io/jordanlambrecht/tracker-tracker:latest
    restart: unless-stopped
    container_name: tracker-tracker-app
    ports:
      - "${PORT:-3000}:3000" # Smokey the Bear says: "Remember friends, you don't need to expose your port if it sits behind a reverse proxy!"
    environment:
      POSTGRES_HOST: tracker-tracker-db
      # POSTGRES_PORT: ${POSTGRES_PORT} uncomment if you change the default port in the db service
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Do NOT rotate this once the app is set up. Besides signing session cookies it
      # wraps the key that encrypts every tracker token and client credential, and it
      # is the only thing that can unlock them without your master password. Change it
      # and `tt-recover` can no longer get you back in after a lockout.
      SESSION_SECRET: ${SESSION_SECRET}
      TZ: ${TZ}
      # LOG_LEVEL: ${LOG_LEVEL} # optional, defaults to 'info'
      # LOG_FILE: /data/logs/tracker-tracker.log # optional
      BASE_URL: ${BASE_URL:-} # optional, i.e https://trackertracker.example.com
      # SECURE_COOKIES: ${SECURE_COOKIES:-} # set to 'true' if serving over HTTPS
      # DISABLE_LOGIN_LOCKOUT: "true" # recovery switch that stops failed-login lockouts from being
      #   enforced. The in-app lockout toggle sits behind the login you cannot reach, so this is
      #   the way back in after locking yourself out. Logs a WARN on first use. Unset and restart
      #   once you are in; a successful login clears the lockout state on its own.
    volumes:
      - ./data:/data
    depends_on:
      tracker-tracker-db:
        condition: service_healthy

  tracker-tracker-db:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: tracker-tracker-db
    environment:
      POSTGRES_DB: tracker_tracker
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_PORT: ${POSTGRES_PORT} uncomment if you want to customize
    volumes:
      - pgdata:/var/lib/postgresql # Don't ever put a database on a network drive
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro # Needed for loading fancy PG18-specific optimizations
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"] # ^Same
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Mousehole keeps a MyAnonamouse seedbox IP current. Uncomment to run it
  # beside Tracker Tracker, then enter http://mousehole:5010 and the token in
  # the MAM tracker's settings. Needs Mousehole v0.5.0 or newer.
  # Mousehole must reach MAM through the same network as your torrent client.
  # This plain layout fits a client without a VPN only; with a VPN client use
  # upstream's gluetun example (docs/docker-compose-examples in the Mousehole
  # repo). Keep MOUSEHOLE_AUTH_TOKEN from here, list the VPN container's name in
  # MOUSEHOLE_ALLOWED_HOSTS instead of mousehole, attach that container to this
  # stack's network, and point the URL above at it.
  # mousehole:
  #   image: tmmrtn/mousehole:latest
  #   restart: unless-stopped
  #   container_name: mousehole
  #   environment:
  #     TZ: ${TZ}
  #     MOUSEHOLE_AUTH_PASSWORD: ${MOUSEHOLE_AUTH_PASSWORD} # web UI login
  #     # Tracker Tracker authenticates with this token; Mousehole's API refuses the password.
  #     MOUSEHOLE_AUTH_TOKEN: ${MOUSEHOLE_AUTH_TOKEN}
  #     # Host names Mousehole answers to. Setting this replaces the localhost default.
  #     # The app reaches it as "mousehole", a browser on this machine as localhost;
  #     # add any other name you open the web UI with.
  #     MOUSEHOLE_ALLOWED_HOSTS: mousehole,localhost
  #   ports:
  #     - "5010:5010" # only needed to reach the Mousehole web UI from your browser
  #   volumes:
  #     - mousehole:/var/lib/mousehole # keeps the MAM cookie across restarts

volumes:
  pgdata:
  # mousehole:
